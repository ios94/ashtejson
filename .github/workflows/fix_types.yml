name: Ashte - Fix games/apps types in JSON

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'تەنها پیشاندان بەبێ گۆڕین؟ (Yes = هیچ ناگۆڕێت)'
        required: true
        default: 'No'
        type: choice
        options:
          - 'No'
          - 'Yes'

jobs:
  fix_types:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fix types (games / apps)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python fix_types.py

          if [ "$DRY_RUN" = "Yes" ]; then
            echo "DRY RUN: هیچ commit نەکرا."
            exit 0
          fi

          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          JSON_FILE=$(echo "YXNodGVtb2JpbGU5NC5qc29u" | base64 --decode)
          git add "$JSON_FILE" backup_memory.json
          git commit -m "Fix games/apps types" || { echo "No changes"; exit 0; }

          for i in {1..10}; do
            git pull origin main --rebase --autostash
            if git push; then echo "✅ push کرا"; exit 0; fi
            sleep 10
          done
          echo "⛔ push سەرکەوتوو نەبوو"; exit 1
