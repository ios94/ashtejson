name: Build iOS Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Dylib
        run: |
          clang -dynamiclib -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -arch arm64 -miphoneos-version-min=13.0 -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore SocialMenu.m -o SocialMenu.dylib
      
      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialMenu-Dylib
          path: SocialMenu.dylib
