name: Smart Add App from Website

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ناوی یارییەکە بنووسە (بۆ نموونە: Subway Surfers)'
        required: true
      website_url:
        description: 'لینکی ماڵپەڕەکەت'
        required: true
        default: 'https://ashtemobile.tututweak.com/o.html'

jobs:
  add_app:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Smart Admin Script
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          WEBSITE_URL: ${{ github.event.inputs.website_url }}
        run: python admin_adder.py

      - name: Upload IPA to Release V1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: V1
          files: ipas/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update JSON Source and Memory
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add ashtemobile94.json backup_memory.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Smart added: ${{ github.event.inputs.app_name }}" && git push)
