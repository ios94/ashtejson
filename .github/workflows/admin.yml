name: AshteMobile - Smart Auto Adder

on:
  workflow_dispatch:
    inputs:
      app_type:
        description: "games or apps"
        required: true
        type: choice
        options:
          - games
          - apps

      app_name:
        description: "Authorized app listing URL or app name"
        required: true
        type: string

      ipa_link:
        description: "Direct IPA URL (optional)"
        required: false
        type: string

  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: ashtemobile-auto-adder
  cancel-in-progress: false

jobs:
  add_app:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lief

      - name: Prepare run
        run: |
          rm -f temp_app.json
          mkdir -p ipas img imgg

      - name: Process app listing
        env:
          APP_TYPE: ${{ inputs.app_type || 'games' }}
          APP_NAME: ${{ inputs.app_name || 'https://check0ver.net/en/iapps?filter%5BinCategories%5D%5B0%5D=9c60f563-1983-42f0-8882-a26207bd4aaf' }}
          IPA_LINK: ${{ inputs.ipa_link || '' }}
        run: |
          python admin_adder.py

      - name: Validate downloaded IPA files
        if: hashFiles('ipas/*.ipa') != ''
        run: |
          python - <<'PY'
          import glob
          import zipfile
          import sys

          files = glob.glob("ipas/*.ipa")
          if not files:
              print("No new IPA files were downloaded.")
              sys.exit(0)

          valid = 0
          for path in files:
              try:
                  with zipfile.ZipFile(path) as z:
                      names = z.namelist()
                      if not any(n.startswith("Payload/") and n.endswith(".app/Info.plist")
                                 for n in names):
                          raise ValueError("Missing app Info.plist in Payload")
                      bad = z.testzip()
                      if bad:
                          raise ValueError(f"Corrupt ZIP member: {bad}")
                  print(f"VALID: {path}")
                  valid += 1
              except Exception as e:
                  print(f"INVALID: {path}: {e}")
                  sys.exit(1)

          print(f"Validated {valid} IPA file(s).")
          PY

      - name: Upload IPA files to Release V1
        if: hashFiles('ipas/*.ipa') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V1
          files: ipas/*.ipa
          overwrite_files: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update app catalogue JSON
        if: hashFiles('temp_app.json') != ''
        run: |
          python admin_adder.py update_json

      - name: Commit catalogue and images
        if: hashFiles('temp_app.json') != ''
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ashtemobile94.json backup_memory.json img/ imgg/

          if git diff --cached --quiet; then
            echo "No catalogue changes to commit."
            exit 0
          fi

          git commit -m "Update AshteMobile app catalogue"
          git push origin HEAD:main
