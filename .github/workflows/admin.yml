name: Admin Panel - Add New App

on:
  workflow_dispatch:
    inputs:
      app_type:
        description: 'ئایا ئەمە یارییە یان بەرنامە؟ (games یان apps)'
        required: true
        type: choice
        options:
          - games
          - apps
      app_name:
        description: 'ناوی یاری (نموونە: Block Blast)'
        required: true
        type: string
      app_version:
        description: 'ڤێرژن (نموونە: 1.0.0)'
        required: true
        type: string
      app_size:
        description: 'قەبارە (نموونە: 150 MB)'
        required: true
        type: string
      app_icon:
        description: 'ناوی وێنەکە یان لینکی وێنەکە لێرە دابنێ'
        required: true
        type: string
      ipa_link:
        description: 'لینکی ڕاستەوخۆی دابەزاندنی IPA'
        required: true
        type: string

jobs:
  add_app:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Admin Script
        env:
          APP_TYPE: ${{ github.event.inputs.app_type }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_VERSION: ${{ github.event.inputs.app_version }}
          APP_SIZE: ${{ github.event.inputs.app_size }}
          APP_ICON: ${{ github.event.inputs.app_icon }}
          IPA_LINK: ${{ github.event.inputs.ipa_link }}
        run: python admin_adder.py

      - name: Upload IPA to Release V1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: V1
          files: ipas/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update JSON Source, Memory, and Images
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add ashtemobile94.json backup_memory.json img/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Admin added: ${{ github.event.inputs.app_name }} (${{ github.event.inputs.app_type }})" && git push)
