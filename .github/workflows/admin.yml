name: Admin Panel - Smart Auto Adder

on:
  workflow_dispatch:
    inputs:
      checkover_link:
        description: 'لینکی یارییەکە لە سایتی checkover دابنێ (نموونە: https://check0ver.net/en/iapps)'
        required: true
        type: string
      app_name_to_find:
        description: 'تەنها ناوی یارییەکە بنووسە (بۆ ئەوەی ڕۆبۆتەکە لەناو سایتەکە بیدۆزێتەوە)'
        required: true
        type: string
      ipa_link:
        description: 'لینکی ڕاستەوخۆی دابەزاندنی IPA'
        required: true
        type: string

jobs:
  add_app:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Smart Scraper Script
        env:
          CHECKOVER_LINK: ${{ github.event.inputs.checkover_link }}
          APP_NAME: ${{ github.event.inputs.app_name_to_find }}
          IPA_LINK: ${{ github.event.inputs.ipa_link }}
        run: python admin_adder.py

      - name: Upload IPA to Release V1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: V1
          files: ipas/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update JSON Source, Memory, and Images
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add ashtemobile94.json backup_memory.json img/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Smart Added: ${{ github.event.inputs.app_name_to_find }}" && git push)
