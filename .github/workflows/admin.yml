name: Admin Panel - Smart Auto Adder

on:
  workflow_dispatch:
    inputs:
      app_type:
        description: 'ئایا ئەمە یارییە یان بەرنامە؟ (games یان apps)'
        required: true
        type: choice
        options:
          - games
          - apps
      app_name:
        description: 'لینکی پەڕەی یارییەکە (لە سایتی check0ver) یان ناوی یارییەکە دابنێ'
        required: true
        type: string
      ipa_link:
        description: 'لینکی ڕاستەوخۆی دابەزاندنی IPA'
        required: true
        type: string

jobs:
  add_app:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 macholib

      - name: Heavy Work (Download IPA and Scrape)
        env:
          APP_TYPE: ${{ github.event.inputs.app_type }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          IPA_LINK: ${{ github.event.inputs.ipa_link }}
        run: python admin_adder.py

      - name: Inject AlertAshte.dylib directly inside IPA files
        run: |
          sudo apt-get update && sudo apt-get install -y zip unzip
          
          # دۆزینەوەی فایلی دابەزێنراوی IPA
          TARGET_IPA=$(ls ipas/*.ipa | head -n 1)
          echo "Processing IPA: $TARGET_IPA"

          if [ -f "$TARGET_IPA" ] && [ -f "AlertAshte.dylib" ]; then
            # دروستکردنی فۆڵدەری کارکردن و دەرهێنانی فایلەکانی ناو IPA
            mkdir -p extracted_ipa
            unzip -q "$TARGET_IPA" -d extracted_ipa/

            # دۆزینەوەی فۆڵدەری .app لە ناو Payload
            APP_DIR=$(find extracted_ipa/Payload -mindepth 1 -maxdepth 1 -name "*.app" | head -n 1)
            APP_BINARY_NAME=$(basename "$APP_DIR" .app)
            MAIN_EXEC="$APP_DIR/$APP_BINARY_NAME"

            echo "App Directory: $APP_DIR"
            echo "Executable Name: $MAIN_EXEC"

            # دروستکردنی فۆڵدەری Frameworks لە ناو ئەپەکە و دانانی dylib تێیدا
            mkdir -p "$APP_DIR/Frameworks"
            cp AlertAshte.dylib "$APP_DIR/Frameworks/AlertAshte.dylib"
            chmod 755 "$APP_DIR/Frameworks/AlertAshte.dylib"

            # بەستنەوەی فایلی dylib بە باینەری سەرەکی ئەپەکە لە ڕێگەی پایتۆن
            python3 - << 'EOF'
          import sys
          import os
          from macholib.MachO import MachO
          from macholib.mach_o import dylib_command, LC_LOAD_DYLIB

          main_exec = sys.argv[1] if len(sys.argv) > 1 else None
          if not main_exec or not os.path.exists(main_exec):
              print("Executable not found!")
              sys.exit(0)

          dylib_path = b"@executable_path/Frameworks/AlertAshte.dylib"

          try:
              m = MachO(main_exec)
              for header in m.headers:
                  cmd = dylib_command()
                  cmd.name = len(dylib_command)
                  cmd.timestamp = 0
                  cmd.current_version = 0
                  cmd.compatibility_version = 0
                  header.commands.append((LC_LOAD_DYLIB, cmd, dylib_path + b'\x00' * ((4 - len(dylib_path) % 4) % 4)))
              
              with open(main_exec, 'rb+') as f:
                  m.write(f)
              print("Successfully injected AlertAshte.dylib into executable.")
          except Exception as e:
              print(f"Injection notice: {e}")
          EOF "$MAIN_EXEC"

            # دووبارە بەستنەوەی فایلی IPA
            rm -f "$TARGET_IPA"
            cd extracted_ipa
            zip -qr "../$TARGET_IPA" Payload
            cd ..

            rm -rf extracted_ipa
            echo "AlertAshte.dylib بە سەرکەوتوویی خرایە ناو خودی فایلی IPA."
          else
            echo "ئاگاداری: فایلی IPA یان AlertAshte.dylib نەدۆزرایەوە، هەنگاوی ئینجێکت تێپەڕێنرا."
          fi

      - name: Upload IPA to Release V1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: V1
          files: ipas/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smart Queue (Safe JSON Update and Push)
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          for i in {1..20}; do
            echo "هەوڵی ژمارە $i: هێنانی تازەترین ڤێرژنی سۆرسەکە..."
            git pull origin main --rebase
            
            echo "خستنە ناوەوەی یارییە نوێیەکە بۆ ناو سۆرسەکە..."
            python admin_adder.py update_json
            
            git add ashtemobile94.json backup_memory.json img/
            git commit -m "Added: ${{ github.event.inputs.app_name }} (${{ github.event.inputs.app_type }})" || echo "No changes"
            
            if git push; then
              echo "سەرکەوتوو بوو! یارییەکە خرایە ناو گیتهاپ."
              break
            else
              echo "هێڵەکە قەرەباڵغە! ڕۆبۆتێکی تر خەریکە... ١٠ چرکە چاوەڕێ دەکەم."
              git restore ashtemobile94.json backup_memory.json || true
              sleep 10
            fi
          done
