name: Admin Panel - Batch Adder (4 Apps)

on:
  workflow_dispatch:
    inputs:
      app_type:
        description: 'ئایا ئەمە یارییە یان بەرنامە؟ (games یان apps)'
        required: true
        type: choice
        options:
          - games
          - apps
      inject_dylib:
        description: 'ئایا AlertAshte.dylib بخرێتە ناو یارییەکان؟'
        required: true
        type: choice
        options:
          - 'Yes'
          - 'No'
      release_tag:
        description: ' '
        required: true
        type: choice
        default: 'V1'
        options:
          - 'V1'
          - 'V2'
          - 'V3'
          - 'V4'
          - 'V5'
      app1_name:
        description: '1. پەڕەی یاری'
        required: false
        type: string
      app1_ipa:
        description: '1. لینکی IPA'
        required: false
        type: string
      app2_name:
        description: '2. پەڕەی یاری'
        required: false
        type: string
      app2_ipa:
        description: '2. لینکی IPA'
        required: false
        type: string
      app3_name:
        description: '3. پەڕەی یاری'
        required: false
        type: string
      app3_ipa:
        description: '3. لینکی IPA'
        required: false
        type: string
      app4_name:
        description: '4. پەڕەی یاری'
        required: false
        type: string
      app4_ipa:
        description: '4. لینکی IPA'
        required: false
        type: string
      app5_name:
        description: '5. پەڕەی یاری'
        required: false
        type: string
      app5_ipa:
        description: '5. لینکی IPA'
        required: false
        type: string
      app6_name:
        description: '6. پەڕەی یاری'
        required: false
        type: string
      app6_ipa:
        description: '6. لینکی IPA'
        required: false
        type: string
      app7_name:
        description: '7. پەڕەی یاری'
        required: false
        type: string
      app7_ipa:
        description: '7. لینکی IPA'
        required: false
        type: string
      app8_name:
        description: '8. پەڕەی یاری'
        required: false
        type: string
      app8_ipa:
        description: '8. لینکی IPA'
        required: false
        type: string
      app9_name:
        description: '9. پەڕەی یاری'
        required: false
        type: string
      app9_ipa:
        description: '9. لینکی IPA'
        required: false
        type: string
      app10_name:
        description: '10. پەڕەی یاری'
        required: false
        type: string
      app10_ipa:
        description: '10. لینکی IPA'
        required: false
        type: string

jobs:
  add_app:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lief

      - name: Heavy Work (Download IPAs and Scrape)
        env:
          APP_TYPE: ${{ github.event.inputs.app_type }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          APP1_NAME: ${{ github.event.inputs.app1_name }}
          APP1_IPA: ${{ github.event.inputs.app1_ipa }}
          APP2_NAME: ${{ github.event.inputs.app2_name }}
          APP2_IPA: ${{ github.event.inputs.app2_ipa }}
          APP3_NAME: ${{ github.event.inputs.app3_name }}
          APP3_IPA: ${{ github.event.inputs.app3_ipa }}
          APP4_NAME: ${{ github.event.inputs.app4_name }}
          APP4_IPA: ${{ github.event.inputs.app4_ipa }}
          APP5_NAME: ${{ github.event.inputs.app5_name }}
          APP5_IPA: ${{ github.event.inputs.app5_ipa }}
          APP6_NAME: ${{ github.event.inputs.app6_name }}
          APP6_IPA: ${{ github.event.inputs.app6_ipa }}
          APP7_NAME: ${{ github.event.inputs.app7_name }}
          APP7_IPA: ${{ github.event.inputs.app7_ipa }}
          APP8_NAME: ${{ github.event.inputs.app8_name }}
          APP8_IPA: ${{ github.event.inputs.app8_ipa }}
          APP9_NAME: ${{ github.event.inputs.app9_name }}
          APP9_IPA: ${{ github.event.inputs.app9_ipa }}
          APP10_NAME: ${{ github.event.inputs.app10_name }}
          APP10_IPA: ${{ github.event.inputs.app10_ipa }}
        run: python admin_adder.py

      - name: Inject Custom Library directly inside IPA files
        if: ${{ github.event.inputs.inject_dylib == 'Yes' }}
        run: python inject.py || true

      - name: Upload IPAs to Release ${{ github.event.inputs.release_tag }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: ipas/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smart Queue (Safe JSON Update and Push)
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          JSON_FILE=$(echo "YXNodGVtb2JpbGU5NC5qc29u" | base64 --decode)
          
          for i in {1..20}; do
            echo "هەوڵی ژمارە $i: هێنانی تازەترین ڤێرژنی سۆرسەکە..."
            git pull origin main --rebase --autostash
            
            echo "خستنە ناوەوەی یارییەکان بۆ ناو سۆرسەکە..."
            python admin_adder.py update_json
            
            # سڕینەوەی IPA ی ناو uploads/ دوای ئەوەی چووە ناو ڕیلیز (بۆ ئەوەی ڕیپۆ قورس نەبێت)
            if [ -f uploads_consumed.txt ]; then
              while read -r f; do
                [ -n "$f" ] && git rm -f --ignore-unmatch "$f" || true
              done < uploads_consumed.txt
            fi

            git add "$JSON_FILE" backup_memory.json img/ imgg/
            git commit -m "Batch Added 4 Apps" || echo "No changes"
            
            if git push; then
              echo "سەرکەوتوو بوو! یارییەکان خرانە ناو گیتهاپ."
              break
            else
              echo "هێڵەکە قەرەباڵغە! ١٠ چرکە چاوەڕێ دەکەم."
              git restore "$JSON_FILE" backup_memory.json || true
              sleep 10
            fi
          done

      - name: Cleanup temporary uploads (release tag "uploads")
        if: ${{ always() }}
        run: |
          if [ -f uploads_consumed_assets.txt ]; then
            while read -r a; do
              [ -n "$a" ] && gh release delete-asset uploads "$a" -y || true
            done < uploads_consumed_assets.txt
          fi
          if [ -f uploads_consumed_branches.txt ]; then
            while read -r b; do
              [ -n "$b" ] && git push origin --delete "$b" || true
            done < uploads_consumed_branches.txt
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
