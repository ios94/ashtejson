name: Auto Extract BuildStore Apps

on:
  schedule:
    - cron: '0 */6 * * هر ٦ سەعات جارێک نوێ دەبێتەوە'
  workflow_dispatch: # بۆ ئەوەی بتوانیت بە دەستیش کاری پێ بکەیت

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run extractor script
        run: python extractor.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add ashtemobile94.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update app links automatically [skip ci]" && git push)
