name: Auto Download IPA and Update Source

on:
  push:
    paths:
      - 'apps.json' # کاتێک گۆڕانکاری لە فایلەکە دەکەیت ئۆتۆماتیکی کار دەکات
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Extractor (Download IPAs & Make JSON)
        run: python extractor.py

      - name: Commit and push JSON source
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add ashtemobile94.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update JSON source" && git push)

      - name: Upload IPAs to Release V1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: V1
          files: ipas/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
